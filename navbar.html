<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
        ul {
            background-color: #bed1c9;
            margin-top: 100px;
            margin-left: 50px;
            margin-right: 50px;
            height:60px;
            text-align: center;
            padding-top: 30px;
        }

        li {
            display: inline;
            margin-right: 56px;
        }

        li a {
            color: black;
            font-family: 'Times New Roman', Times, serif;
            text-decoration: none;
        }

        li a:hover {
            background-color: #555555;
            color: white;
        }
        button a {
            background-color: rgb(13, 15, 49);
            color: whitesmoke;
            text-decoration: none;
            
            
        }
    </style>
</head>

<body>

<ul>

  <li><a href="#">Home</a></li>
  <li><a href="#">About</a></li>
  <li><a href="#">News</a></li>
  <li><a href="#">Contact</a></li>
  <li><button><a href="">Get Now</a></button></li>
  
</ul>

</body>
</html>
